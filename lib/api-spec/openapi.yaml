openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CataMex Central Hub API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: distributors
    description: Distributor application management
  - name: catalog
    description: Product catalog
  - name: regions
    description: Regional configuration

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /distributors:
    get:
      operationId: listDistributors
      tags: [distributors]
      summary: List all distributor applications
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: region
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of distributor applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Distributor"
    post:
      operationId: createDistributor
      tags: [distributors]
      summary: Submit a distributor application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistributorInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Distributor"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /distributors/{id}:
    get:
      operationId: getDistributor
      tags: [distributors]
      summary: Get a distributor application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Distributor application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Distributor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateDistributorStatus
      tags: [distributors]
      summary: Update distributor application status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DistributorStatusUpdate"
      responses:
        "200":
          description: Updated distributor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Distributor"

  /distributors/stats:
    get:
      operationId: getDistributorStats
      tags: [distributors]
      summary: Get distributor application statistics by region
      responses:
        "200":
          description: Application stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributorStats"

  /catalog:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List all catalog products
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: brand
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /catalog/{id}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get a single product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /catalog/featured:
    get:
      operationId: getFeaturedProducts
      tags: [catalog]
      summary: Get featured/highlighted products
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /regions:
    get:
      operationId: listRegions
      tags: [regions]
      summary: List all supported regions with contact info
      responses:
        "200":
          description: Regions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Region"

  /regions/{code}:
    get:
      operationId: getRegion
      tags: [regions]
      summary: Get region by country code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Region data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Region"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Distributor:
      type: object
      required:
        - id
        - companyName
        - contactName
        - email
        - phone
        - country
        - city
        - businessType
        - estimatedMonthlyVolume
        - status
        - createdAt
      properties:
        id:
          type: integer
        companyName:
          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: string
        country:
          type: string
        city:
          type: string
        businessType:
          type: string
          enum: [refaccionaria, taller, distribuidor_mayorista, otro]
        estimatedMonthlyVolume:
          type: string
          enum: [menos_50, cincuenta_200, doscientos_500, mas_500]
        taxId:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string

    DistributorInput:
      type: object
      required:
        - companyName
        - contactName
        - email
        - phone
        - country
        - city
        - businessType
        - estimatedMonthlyVolume
      properties:
        companyName:
          type: string
          minLength: 2
          maxLength: 200
        contactName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 7
          maxLength: 20
        country:
          type: string
        city:
          type: string
          minLength: 2
          maxLength: 100
        businessType:
          type: string
          enum: [refaccionaria, taller, distribuidor_mayorista, otro]
        estimatedMonthlyVolume:
          type: string
          enum: [menos_50, cincuenta_200, doscientos_500, mas_500]
        taxId:
          type: string
        message:
          type: string
          maxLength: 1000

    DistributorStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]

    DistributorStats:
      type: object
      required:
        - total
        - pending
        - approved
        - rejected
        - byRegion
      properties:
        total:
          type: integer
        pending:
          type: integer
        approved:
          type: integer
        rejected:
          type: integer
        byRegion:
          type: array
          items:
            type: object
            required: [country, count]
            properties:
              country:
                type: string
              count:
                type: integer

    Product:
      type: object
      required:
        - id
        - name
        - sku
        - category
        - description
        - compatibleBrands
        - certifications
        - isFeatured
      properties:
        id:
          type: integer
        name:
          type: string
        sku:
          type: string
        category:
          type: string
          enum: [convertidor_catalitico, escape, silenciador, tubo_flexible]
        description:
          type: string
        technicalSpecs:
          type: object
          additionalProperties:
            type: string
        compatibleBrands:
          type: array
          items:
            type: string
        certifications:
          type: array
          items:
            type: string
        imageUrl:
          type: ["string", "null"]
        isFeatured:
          type: boolean

    Region:
      type: object
      required:
        - code
        - name
        - currency
        - phone
        - email
        - address
        - isActive
      properties:
        code:
          type: string
        name:
          type: string
        currency:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        whatsapp:
          type: ["string", "null"]
        distributionTime:
          type: ["string", "null"]
        isActive:
          type: boolean
