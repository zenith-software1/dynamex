name: Deploy GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build static site
        env:
          BASE_PATH: /dynamex/
          VITE_MOCK_API: "true"
        run: pnpm --filter @workspace/catalytic-hub run build

      - name: SPA fallback for GitHub Pages
        run: cp artifacts/catalytic-hub/dist/public/index.html artifacts/catalytic-hub/dist/public/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/catalytic-hub/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
